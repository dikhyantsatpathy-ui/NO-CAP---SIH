Feel free to ask me anything in plain simple words—from *'Where is the upload button?'* to *'How does 2D-FFT tampering work?'*!`,s:"frontend/src/App.tsx · app/main.py"},{id:"where-upload-ui",tags:["where","upload","button","dropzone","screen","how","to","intake","card","click","file","front","back","use","website","ui"],q:"Where is the document upload section on the screen and how do I use it?",a:"Here is where to find the upload section and how to screen a document:\n\n1. **Go to the `Desk` Tab**: At the top navigation bar, click the **`Desk`** tab (the first tab on the left).\n2. **Step 1 — Traveller Intake**: Enter the traveller's Name, Nationality, and Purpose of Travel (e.g. Tourism, Trade), then click **Start Traveller Session**.\n3. **Step 2 — Document Intake (Upload Section)**:\n   - Located right in the middle under **`Step 2: Document Intake & Optical Scan`**.\n   - Select the **Document Type** (Passport, Aadhaar, PAN, Driving Licence, Voter ID, Nepali Citizenship).\n   - Drop your files into the **`Side A (Front / Bio Page)`** and optional **`Side B (Back / Address Page)`** boxes, or click **Browse Files**.\n   - Alternatively, click any button in the **Specimen Quick-Picker** on the right (e.g., *Genuine Passport*, *Forged PAN*) to test with instant samples without uploading files!\n4. **Inspect & Decide**: The system instantly runs the 4 modules in under 800ms. Click the green **`Approve & Sign to Ledger`** button to finalize or the amber **`Flag for Supervisor Review`** button if suspicious.",s:"frontend/src/views/DeskView.tsx:80-260"},{id:"what",tags:["what","is","nocap","project","about","sih","genesis","ssb","border","purpose","overview","introduction"],q:"What is this project and what problem does it solve?",a:`**SSB Border Screening (SIH26188)** is an enterprise AI-powered fake identity and document screening console built specifically for the Sashastra Seema Bal (SSB) and Ministry of Home Affairs (MHA) border checkpoint inspection desks (Indo-Nepal and Indo-Bhutan frontiers).

It enables screening officers to upload physical or digital identity documents (Passport, Aadhaar, PAN, Driving Licence, Voter ID / EPIC, Nepal Citizenship, Bhutan ID) along with an optional live face capture. The engine runs a **4-Module Forensic Pipeline** in under 800ms, computing an explainable Risk Score (0–100) and automated verdict (**CLEAR**, **REVIEW**, or **FLAGGED**). All operations adhere to **Zero-Raw-Storage** privacy (DPDP Act 2023) and generate court-admissible audit chains (BSA 2023 Section 65B).`,s:"README.md · app/main.py · app/screening.py"},{id:"modules-all",tags:["modules","pipeline","four","m1","m2","m3","m4","forensic","architecture","screening","flow"],q:"Explain the Four-Module Forensic Screening Pipeline.",a:`The screening desk evaluates every traveller document through four isolated, deterministic, and AI-assisted modules:

1. **Module 1 — Multi-Pass Optical Extraction (M1)**: Extracts textual fields, MRZ zones, and UIDAI Secure QR codes using RapidOCR (ONNX), PyTesseract, and 4-way rotation scans with EXIF transpose.
2. **Module 2 — Document Validation & Checksums (M2)**: Performs mathematical checksum verification (ICAO 9303 Doc 731 weights for passports/visas, Verhoeff algorithm for Aadhaar, state RTO series for Driving Licences, ITD category checks for PAN), expiry rules, and privacy-preserving hashed watchlist matches.
3. **Module 3 — Document Forensics & Tamper Detection (M3)**: Executes image forensics including JPEG Error Level Analysis (ELA), 2D-FFT spectral Peak-to-Average Power Ratio (PAPR) for print-scan forgery, and Photo-Response Non-Uniformity (PRNU) sensor noise correlation for spliced portrait detection.
4. **Module 4 — Biometric Facial Verification (M4)**: Detects face crops on the document and compares them against live webcam frames using 512-dimensional face embeddings with cosine similarity, age-aware thresholding, and interactive challenge-response liveness (blink, head nod).`,s:"app/screening.py · app/forensics.py · app/face.py · app/identity.py"},{id:"module-1",tags:["module 1","m1","ocr","extraction","rapidocr","tesseract","aadhaar","pan","passport","mrz","qr","barcode"],q:"How does Module 1 (OCR Extraction) work?",a:`**Module 1 (OCR Extraction)** handles dual-sided image and PDF document uploads with robust pre-processing:
- **Auto-Rotation & EXIF Normalization**: Corrects orientation across 0°, 90°, 180°, and 270° angles.
- **Contrast Equalization & Unsharp Masking**: Uses CLAHE and Gaussian filtering to eliminate glare on laminated ID cards.
- **UIDAI Secure QR & Barcode Parsing**: Extracts 100% cryptographic text directly from Aadhaar 2048-bit RSA QR codes or Code128 barcodes.
- **YOLO ROI Zone Detection**: Uses a trained 5-class YOLO model to isolate Aadhaar/PAN fields (Name, DOB, Gender, ID Number, Photo).
- **Dual-Sided Merging**: Non-destructively merges front and back images to capture full address, parentage, and QR payload.`,s:"app/extraction.py · app/yolo_roi.py · app/qr_decoder.py"},{id:"module-2",tags:["module 2","m2","validation","checksum","icao","9303","verhoeff","pan","dl","voter","epic","expiry","six month"],q:"How does Module 2 (Document Validation & Checksum Rules) work?",a:`**Module 2 (Validation)** performs deterministic, zero-trust verification:
- **ICAO Doc 9303 TD1/TD2/TD3**: Computes repeating 7-3-1 weight check-digits over document number, date of birth, expiry date, and composite checksum.
- **Aadhaar Verhoeff Checksum**: Validates the 12-digit UIDAI number using the D8 dihedral permutation matrix.
- **PAN Category & Structure**: Validates 5-letter prefix, mandatory entity code (\`P\` for individual, \`C\` for company, etc. in 4th character), 4 digits, and check letter.
- **Driving Licence (SARATHI / Parivahan)**: Confirms state code + 2-digit RTO + 4-digit issue year + 7-digit serial number.
- **Travel Validity & 6-Month Rule**: Flags passports expiring within 180 days of border crossing.
- **Privacy-Preserving Watchlist**: Compares SHA-256 digests against blacklisted syndicates without storing raw numbers.`,s:"app/identity.py · app/validation.py · app/mrz.py"},{id:"module-3",tags:["module 3","m3","forensics","tampering","ela","error level analysis","fft","papr","prnu","noise","heatmap"],q:"How does Module 3 (Forensic Tamper Detection) detect forged IDs?",a:`**Module 3 (Forensics)** catches digital tampering, photoshop splices, and print-scan clones:
- **JPEG Error Level Analysis (ELA)**: Resaves the image at 90% quality and analyzes compression artifact variance across modified text/photo regions.
- **2D-FFT Spectral PAPR**: Computes the 2D Fast Fourier Transform high-frequency spectral density to distinguish genuine continuous-tone sensor noise from halftone printer screening or digital screen recaptures.
- **PRNU Sensor Noise Correlation**: Extracts photo-response non-uniformity sensor noise from the portrait zone to verify if the photo belongs to the same camera sensor as the rest of the document card.
- **Laplacian Blur Variance**: Quantifies edge sharpness to detect motion blur or intentional defocusing.`,s:"app/forensics.py · app/screening.py"},{id:"module-4",tags:["module 4","m4","face","biometrics","facial","recognition","cosine","liveness","blink","nod","spoof"],q:"How does Module 4 (Biometrics & Live Face Matching) work?",a:`**Module 4 (Biometrics)** verifies that the traveller presenting the document is its rightful holder:
- **Face Embedding Comparison**: Crops the document portrait and compares it against live webcam captures using a 512-dimensional deep neural network embedding.
- **Cosine Similarity & Thresholds**: Baseline match threshold is 0.65; adjusts dynamically based on the age difference between document issue date and current crossing.
- **Challenge-Response Liveness**: Prompts the officer/traveller to perform random physical gestures (e.g. blink twice, turn head left, nod) across a multi-frame burst to defeat static photo attacks, printed cutouts, and 3D silicone masks.
- **Anti-Virtual-Camera Jitter**: Analyzes inter-frame micro-jitter and exposure timestamps to defeat OBS virtual camera injection.`,s:"app/face.py · app/forensics.py · app/main.py"},{id:"zero-storage",tags:["privacy","zero storage","dpdp","act","2023","pii","security","encryption","hash","masking","compliance"],q:"How does the system ensure Zero-Raw-Storage and DPDP Act 2023 compliance?",a:"Under the **Digital Personal Data Protection (DPDP) Act, 2023**, storing citizen identity scans and plaintext PII introduces massive security risks. Our system enforces **Zero-Raw-Storage by design**:\n- **Ephemeral In-Memory Processing**: Uploaded images and live camera frames exist only in volatile memory during pipeline execution and are zeroed immediately after.\n- **Masked Persistence**: The database stores only masked fields (e.g. `****1234`, `A****G`, `*** Nayak`) and deterministic SHA-256 cryptographic hashes.\n- **Zero Plaintext Logs**: Application logs and structured telemetry never print raw document numbers or holder names.\n- **Privacy-Preserving Watchlist**: Watchlist entries store only `SHA-256(normalized_id)` + search reason.",s:"app/screening.py · app/main.py · app/session.py"},{id:"blockchain-bsa",tags:["blockchain","ledger","bsa","2023","section 65b","evidence","court","admissibility","merkle","hash chain","dossier"],q:"How does the Immutable Hash-Chain Ledger & BSA 2023 Section 65B certification work?",a:"Under **Section 65B of the Bharatiya Sakshya Adhiniyam, 2023 (BSA)**, electronic records are court-admissible only if their integrity and chain of custody are mathematically provable:\n- **SHA-256 Chained Blocks**: Every screening pass links cryptographically to the previous report hash (`previous_hash` + `payload_hash` -> `ledger_hash`).\n- **Session Merkle Trees**: Cross-document border sessions compute a Merkle root over all submitted documents.\n- **HMAC Desk Sealing**: Printable Court Dossiers are cryptographically sealed with the station's inspection key, timestamped in IST.\n- **Section 65B Export**: Officers can generate signed electronic record certificates stating the machine parameters, cryptographic digest, and officer attribution for trial submission.",s:"app/session.py · app/main.py · scripts/anchor_ledger.py"},{id:"checkpoints-treaty",tags:["checkpoints","border","indo nepal","indo bhutan","treaty","1950","panitanki","raxaul","sonauli","jaigaon","ssb"],q:"What border checkpoint sectors and treaties are supported?",a:`The console is pre-configured with operational parameters for major SSB Integrated Check Posts (ICPs):
- **Panitanki (West Bengal)**: Indo-Nepal corridor (Kakarbhitta crossing).
- **Raxaul (Bihar)**: Major commercial and transit corridor to Birgunj, Nepal.
- **Sonauli (Uttar Pradesh)**: High-volume passenger route near Lumbini, Nepal.
- **Jaigaon (West Bengal)**: Primary gateway into Phuentsholing, Bhutan.

**Treaty Compliance**:
- **Indo-Nepal 1950 Treaty of Peace and Friendship**: Permits Indian and Nepalese citizens to cross without visas, validating Nepali Citizenship Cards, Election Cards, and Passports.
- **Indo-Bhutan Travel Agreement**: Enforces Bhutanese Voter ID / Citizenship Identity Card protocols.
- **Third-Country Nationals**: Mandates standard passport, valid Indian Visa / e-Visa, and biometrics.`,s:"app/config.py · app/guide.py · app/screening.py"},{id:"syndicate-graph",tags:["syndicate","network","graph","cluster","cross checkpoint","recidivism","fraud ring","alerts"],q:"How does the Cross-Border Syndicate Monitor detect fraud rings?",a:`The **Syndicate Monitor (\`app/syndicate.py\`)** connects screening digests across all ICPs in near-real-time:
- **Velocity & Clashing Alerts**: Detects when the same identifier or photo embedding appears at two different checkpoints (e.g. Panitanki and Sonauli) within an impossible transit window.
- **Cluster Analysis**: Flags coordinated fraud rings where multiple individuals present documents with sequential serial numbers, identical templates, or shared forged stamps.
- **Recidivism Tracking**: Alerts desk officers if an individual whose document was previously FLAGGED or ADJUDICATED as fraud attempts entry at a different crossing.`,s:"app/syndicate.py · frontend/src/views/DeskView.tsx"},{id:"tech-stack",tags:["tech","stack","fastapi","react","vite","neon","postgres","sqlite","onnx","rapidocr","python","typescript"],q:"What is the complete technology stack?",a:`**Backend Architecture**:
- **Language & Framework**: Python 3.12, FastAPI (async/await throughout), Starlette.
- **Database**: PostgreSQL on Neon Serverless with automatic background keep-alive ping; local high-availability SQLite fallback with WAL mode.
- **ML & Forensics**: RapidOCR (ONNX Runtime), OpenCV, NumPy, SciPy, PyPDF.
- **Security & Rate Limiting**: SlowAPI, Google OAuth 2.0 OpenID Connect.

**Frontend Architecture**:
- **Core**: React 18, TypeScript, Vite.
- **Styling**: Vanilla CSS Design System with curated Navy & Off-White tokens, glassmorphism, responsive data grids, and zero third-party bloated CSS frameworks.
- **AI Assistant**: Direct Google Gemini Chat (\`gemini-3.5-flash\` / \`gemini-3.5-flash-lite\`) with full codebase database ingestion.`,s:"pyproject.toml · package.json · app/main.py · frontend/src/styles.css"},{id:"neon-db",tags:["neon","database","keepalive","postgres","serverless","performance","speed","fast"],q:"How is Neon DB kept lightning-fast without sleeping?",a:"Neon serverless PostgreSQL automatically scales to zero after ~5 minutes of idle time. To eliminate cold-start latency, the backend runs a dedicated background keep-alive loop (`_neon_keepalive_loop`) inside FastAPI's `lifespan`. Every 210 seconds (~3.5 minutes), it sends a lightweight `SELECT 1` ping to keep connection pools warm, active, and instantly responsive.",s:"app/main.py:2070-2095"},{id:"dual-sided",tags:["dual sided","two side","front","back","aadhaar back","dl back","intake"],q:"How does dual-sided document intake work?",a:"Identity documents like Aadhaar cards and Driving Licences carry crucial data on both sides (Front: Name, DOB, Photo, ID Number; Back: Permanent Address, Father/Husband Guardian details, UIDAI QR Code). The desk UI provides an optional 'Upload Back Side' dropzone. When supplied, Module 1 performs optical extraction on both surfaces and non-destructively merges the verified back address and QR payload into the primary report.",s:"frontend/src/views/DeskView.tsx · app/extraction.py · app/screening.py"}],Xp=["Where is the upload section on the screen and how to use it?","What is this project and what problem does it solve?","Explain the Four-Module Forensic Screening Pipeline.","How does Module 3 (Forensic Tamper Detection) detect forged IDs?","How does Module 4 (Biometrics & Live Face Matching) work?","How does the system ensure Zero-Raw-Storage & DPDP Act compliance?","How does the Immutable Hash-Chain Ledger & BSA 2023 evidence work?","How is Neon DB kept lightning-fast without sleeping?"],_l=o=>o.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();function eh(o,u=2){co
