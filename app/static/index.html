ake":{t:"Report this fake",b:"For a result that came back as a forgery: it logs that exact copy as a scam so others can see it circulated, and the network learns from it."},"trust this file":{t:"Trust this file",b:"A confirmation after a positive check: you ran the scan, the app says AUTHENTIC, so you can safely treat the file as the real thing."},"verify who signed this":{t:"Verify who signed this",b:"Reveals the person behind the signature — name, job title and organisation. These details are assigned by an admin, not typed by the signer, so nobody can make themselves look important."},"check with the issuer":{t:"Check with the issuer",b:"Shows the office that supposedly issued the file, so you can call them directly and double-check before you trust or share it."},"no official source":{t:"No official source",b:"This button is greyed out on purpose: the file was never signed by any authority, so there is no official source to check yet."},compare:{t:"Compare a copy",b:"Paste another fingerprint (or drop a second copy) and the app immediately says match or mismatch. Perfect for spotting a slightly different 'copy' of a real file."},"google single sign-in":{t:"Google sign-in",b:"The officials' unlock button. Sign in with Google, the server quietly creates a private signing key inside a locked vault, and gives you a session cookie. Your private key never leaves the server — you never see it, so nobody can steal it from you."},"sign & anchor":{t:"Sign & anchor",b:"The official's 'make it official' button. It stamps the file with an invisible mark, records a receipt in the public ledger, and locks a summary onto the blockchain. You get the signed file back to distribute."},"issue signed broadcast":{t:"Issue signed broadcast",b:"The official's 'announce it' button. Takes the text message, signs it, timestamps it, and puts it on the public bulletin board so everyone can verify it's really from that office."},"issue broadcast":{t:"Issue broadcast",b:"Publishes the draft message as a signed, timestamped emergency notice on the public board."},"assign role":{t:"Assign role (admin only)",b:"Admin-only: gives an official their job title and organisation. Whatever is typed here is what shows up on everything they sign. Officials can't write their own title, which stops impostors."},"set pin":{t:"Set PIN",b:"Sets a secret 5-digit code. If the official's account is ever hijacked, this PIN is the emergency kill switch to shut down their signing key."},"revoke access":{t:"Revoke (kill switch)",b:"The emergency stop button. Using the PIN, an official can permanently retire a signing key — and every file that key ever signed turns into REVOKED across the whole network, instantly. Old copies suddenly can't be trusted, which is exactly what you want if someone's keys were stolen."},reinstate:{t:"Reinstate",b:"The admin's undo button. Brings a revoked key back to life — but only with the original PIN, so one careless click can't un-retire a whole batch by accident."},"batch anchor":{t:"Batch anchor (L2 sync)",b:"Admin command: bundles all unsealed records into one tree, then stamps its summary onto the blockchain — the permanent public receipt book that nobody can quietly edit."},"inject demo attack":{t:"Inject demo attack",b:"A demo-only toy button. It plants fake 'caught a fake!' records so a judge can watch the fraud dashboard light up. The data is invented and harmless."},"rollback ledger":{t:"Rollback ledger",b:"An admin emergency drill: wipes every record newer than a chosen time. It deliberately works while staying visible on the blockchain, so it can't be abused in secret."},"screen document":{t:"Screen document",b:"For officials checking a passport, visa, driving licence, PAN, or voter ID. Upload the photo or PDF, and the app reads the details, checks the numbers follow the official rules, and gives a clear score — CLEAR, REVIEW, or FLAGGED — with plain-English reasons for every point."},"court dossier":{t:"Court dossier",b:"Opens a printable report with masked fields, module results, reasons, and an HMAC integrity seal. It proves the report has not changed, but legal admissibility still depends on the applicable evidence rules."},"export shift log":{t:"Export shift log (admin only)",b:"Downloads the selected screenings as a CSV with a SHA-256 digest at the end, so supervisors can detect later edits to the exported file."},clear:{t:"Clear (supervisor's call)",b:"The supervisor says 'this document looks genuine'. The decision is recorded permanently — it becomes part of the official paper trail."},"confirm fraud":{t:"Confirm fraud",b:"The supervisor agrees the document is a fake. The evidence and reasoning stay attached to the report permanently."},inconclusive:{t:"Inconclusive",b:"The supervisor can't decide, so the case is handed to a human for a closer look — better than guessing."},"add to watchlist":{t:"Add to watchlist (admin only)",b:"Stores a hidden fingerprint of a known-bad PAN, passport, visa, licence, voter ID, or phone number — never the value itself, for privacy. If that fingerprint ever shows up in a screening again, it instantly glows red as a risk."},remove:{t:"Remove",b:"Takes a number off the watchlist so it no longer raises flags in screening."},"check previous broadcasts":{t:"Check previous broadcasts",b:"Opens the full history of past official notices, each with an exact date and time, so you can scroll back further than today."},"view all":{t:"View all",b:"Shows every past official notice instead of just today's."},"view archive":{t:"View archive",b:"Expands this card to show every official notice ever posted, not just today's. Click again to shrink back. Nothing underneath is blocked — you can keep using the page."},"show recent only":{t:"Show recent only",b:"Collapses the list back to today's notices."},"theme-toggle":{t:"Theme toggle",b:"Switches between light and dark mode, whichever is easier on your eyes. Your choice is remembered."},"switch to dark mode":{t:"Dark mode", fields. The pipeline **extracts fields, validates format rules and checksums (ICAO 9303 MRZ for passports/visas), checks expiry and travel validity, cross-checks the watchlist, detects tampering, verifies the holder's face, and watches for cross-checkpoint syndicate patterns** — returning CLEAR / REVIEW / FLAGGED with one explainable reason per risk point. Only masked identifiers are stored.",s:"MHA_SCREENING.md + app/screening.py"},{id:"modules",tags:["module","m1","m2","m3","m4","extract","validate","tamper","face","mrz","ocr","ela","prnu","fft"],q:"What are the four screening modules?",a:"**M1 — Extract**: OCR reads the printed fields, MRZ, and declared numbers (PDF or photo, in-memory only). **M2 — Validate**: checks MRZ check digits, document-number format rules, expiry and the six-month travel rule, and the hash-only watchlist. **M3 — Tamper**: three forensics — ELA (re-saved JPEG regions), 2D-FFT spectral (unnatural pixel patterns), and PRNU noise (spliced portrait). **M4 — Face**: compares the document portrait with a live camera capture to catch impostors using someone else's genuine document.",s:"app/screening.py + AuthorityView module panels"},{id:"screen-reports",tags:["screening","dossier","syndicate","shift","export","report","evidence","travel","validity","adjudicate"],q:"What screening reports and alerts are available?",a:"Each report carries a four-module scorecard, travel-validity status, and syndicate alerts when the same identifier reappears, clashes, or surges at a checkpoint. Supervisors can open a printable HMAC-sealed court dossier or export a signed shift log. Adjudications (CLEARED / CONFIRMED_FRAUD / INCONCLUSIVE) are reserved for supervisors — human-in-the-loop over the AI verdict.",s:"MHA_SCREENING.md + app/main.py screening routes"},{id:"syndicate",tags:["syndicate","cross","border","clash","cluster","checkpoint","alert","recidivism","pattern"],q:"How does the syndicate monitor work?",a:"The monitor analyses all recent screenings across checkpoints for organised-fraud patterns: the same identity used at multiple border posts, a cluster of suspicious documents from one origin, or an individual flagged repeatedly. Alerts are tagged CRITICAL / HIGH with the checkpoint, so a supervisor can spot a cross-border ring the moment a pattern forms.",s:"app/syndicate.py + ScreeningDesk monitor panel"},{id:"watchlist",tags:["watchlist","blacklist","flagged","administrator","privacy","hash","pan","passport","visa","licence","voter","phone"],q:"How does the watchlist work without storing raw numbers?",a:"Administrators choose a supported identifier category — PAN, passport, visa, driving licence, voter ID, or phone — then add a *hashed* identifier plus a reason phrase. Screening compares identifiers **before hashing**, so the raw value never touches the database — zero plaintext storage. If a watchlisted fingerprint shows up again, it glows red as a risk.",s:"MHA_SCREENING.md watchlist section"},{id:"roles",tags:["roles","access","officer","administrator","approve","authorisation","authz","google","sso"],q:"Who can do what?",a:"The console is locked behind **Google single sign-in**. **Approved officers** (admin-assigned post & institution) can screen documents at checkpoints. **Administrators** adjudicate verdicts, manage the watchlist, and assign roles. A sign-in without an assigned role is blocked from screening until an administrator approves it. Titles are granted, never self-claimed.",s:"app/main.py access model + frontend OfficerDirectory"},{id:"ai",tags:["ai","detector","heuristic","onnx","deepfake","genai","face","embedding"],q:"What AI does the screening engine use?",a:"The engine fuses **four on-device/cloud paths**: checksum-based validation rules, an OCR pipeline, tamper forensics (ELA / spectral / PRNU, with a YOLO ROI pre-check), and face-embedding cosine comparison when a live capture is attached. No photo is ever sent to image-AI analysis — the module matrix and the tamper heatmap give a supervisor proof, not just a probability.",s:"app/screening.py + app/codebase.py blueprint"},{id:"privacy",tags:["privacy","zero","storage","pii","hash","mask","sensitive","data","audit"],q:"Is this privacy-safe / zero-storage?",a:"Yes by design: **document bytes and live captures are processed in memory and never stored**; the audit trail keeps hashes and *masked* identifiers, never raw content or naked numbers; the watchlist stores only hashes. The footer reads `ZERO-STORAGE AUDIT TRAIL`.",s:"app/screening.py zero-storage discipline"},{id:"dossier",tags:["dossier","court","evidence","hmac","print","seal","statutory"],q:"What is the court dossier?",a:"Every screening report has a **tamper-evident dossier** (printable) sealed by the inspection desk key. It carries the verdict, per-risk reasons, module scorecard, watchlist hits, syndicate alerts, and the adjudication record. The seal proves the record wasn't edited after screening; it does not by itself establish legal admissibility.",s:"app/main.py dossier route"},{id:"tech",tags:["tech","stack","fastapi","react","vite","vercel","postgres","provider"],q:"What is the tech stack?",a:"**Backend**: FastAPI + SQLAlchemy over PostgreSQL, Google OAuth for the officer console. The screening engine lives in `app/main.py`, `app/screening.py`, `app/syndicate.py`, `app/forensics.py`, `app/face.py`, `app/mrz.py`, `app/validation.py`, `app/extraction.py`, `app/identity.py`, `app/transliterate.py`. **Frontend**: React + TypeScript + Vite, built into a single self-contained `app/static/index.html`. Deployable on Vercel via `api/index.py`.",s:"requirements.txt + package.json"},{id:"run",tags:["run","start","install","setup","local","port","8000"],q:"How do I run it locally?",a:"Double-click **START.bat** (Windows): it installs Python + npm deps on first run, rebuilds the frontend, starts `uvicorn` on port 8000 and opens the browser. Manual: `python -m pip install -r requirements.txt`, `npm install && npm run build` in `frontend/`, then `uvicorn main:app --port 8000` from `app/`.",s:"START.bat + HOW_TO_HOST.md"},{id:"explain",tags:["explain","mode","breakdown","layman","details","why","reason","tooltip","help","guide"],q:"What is Explain Mode?",a:"**Explain mode** is an interactive educational switch in the top bar (`frontend/src/app/explain.tsx`). When toggled **ON**, the cursor changes to a help pointer and tapping a control opens a plain-English 'what & why' card about that action instead of performing it — built for non-technical officers and judges to explore the desk safely.",s:"frontend/src/app/explain.tsx"}],ip=["What does this project do?","What are the four screening modules?","How does the watchlist work without storing raw numbers?","What AI does the screening engine use?","Who can do what?","What is Explain Mode?","How do I run it locally?"],Zs=u=>u.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();function sp(u,d=2){const a=Zs(u);if(!a)return[];const w=a.split(" ").filter(Boolean);return lp.map(x=>{const P=Zs(x.tags.join(" ")),_=Zs(x.q);let S=0;for(const z of w)P.includes(z)?S+=3:_.includes(z)&&(S+=1),(P.startsWith(z)||_.includes(z))&&(S+=1);return w.every(z=>P.includes(z)||_.includes(z))&&(S+=4),{e:x,score:S}}).filter(x=>x.score>0).sort((x,P)=>P.score-x.score).slice(0,d).map(x=>x.e)}function Xs(u){const d=sp(u,2);return d.length?d.map(a=>a.a+(a.s?`
